name: Publish to PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable or prerelease version to publish, without the v prefix
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish to PSGallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Resolve and validate the release tag
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release version '$env:RELEASE_VERSION' is not valid."
          }
          $expectedTag = "v$env:RELEASE_VERSION"
          $actualTag = git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -or $actualTag -ne $expectedTag) {
            throw "The checked-out commit must have the exact tag '$expectedTag'."
          }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Find the successful package workflow
        id: workflow
        uses: actions/github-script@v8
        env:
          PACKAGE_ARTIFACT: cd-extras-package-${{ steps.release.outputs.sha }}-${{ inputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'onPush.yaml',
              head_sha: process.env.RELEASE_SHA,
              status: 'success',
              event: 'push',
              per_page: 100
            });
            for (const run of response.data.workflow_runs) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100
                }
              );
              if (artifacts.some(artifact =>
                artifact.name === process.env.PACKAGE_ARTIFACT && !artifact.expired
              )) {
                core.setOutput('run-id', run.id);
                return;
              }
            }
            core.setFailed(
              `No successful workflow produced ${process.env.PACKAGE_ARTIFACT}.`
            );

      - name: Download the validated package
        uses: actions/download-artifact@v6
        with:
          name: cd-extras-package-${{ steps.release.outputs.sha }}-${{ inputs.version }}
          path: out/${{ inputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.workflow.outputs.run-id }}

      - name: Validate the downloaded package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          Install-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0 `
            -Scope CurrentUser -Force
          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0
          $package = "./out/$env:RELEASE_VERSION/cd-extras.$env:RELEASE_VERSION.nupkg"
          ./tests/validate-package.ps1 -PackagePath $package -Version $env:RELEASE_VERSION
        shell: pwsh

      - name: Publish the validated package
        env:
          PSNugetKey: ${{ secrets.PSNugetKey }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $package = "./out/$env:RELEASE_VERSION/cd-extras.$env:RELEASE_VERSION.nupkg"
          ./publishme.ps1 -Version $env:RELEASE_VERSION -PackagePath $package `
            -Publish -Confirm:$false
        shell: pwsh
