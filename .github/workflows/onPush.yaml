name: Run tests
on: push

jobs:
  analyse:
    name: Analyse source and public API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check repository for whitespace errors
        run: |
          $emptyTree = git hash-object -t tree /dev/null
          if ($LASTEXITCODE) { throw 'Could not create an empty Git tree.' }
          git diff --check $emptyTree HEAD
          if ($LASTEXITCODE) { throw 'git diff --check failed.' }
        shell: pwsh

      - name: Run PSScriptAnalyzer and validate the source module
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          ./tests/analyse.ps1
          ./tests/validate-module.ps1 -ModulePath ./cd-extras/cd-extras.psd1 `
            -ApprovedExportsPath ./tests/approved-exports.psd1
        shell: pwsh

  test:
    name: Run tests
    needs: analyse
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run the tests
        run: |
          md ./_reports
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0 `
            -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0
          ./tests/test.ps1 -Cover -EnableExit `
            -CoverageOutputPath ./_reports/coverage-${{ matrix.os }}.xml `
            -TestResultOutputPath ./_reports/testresults-${{ matrix.os }}-pwsh.xml
        shell: pwsh

      - name: Upload PowerShell test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test Report (${{ matrix.os }}, pwsh)
          path: _reports/testresults-${{ matrix.os }}-pwsh.xml

      - name: Upload coverage to Codecov
        if: always() && hashFiles(format('_reports/coverage-{0}.xml', matrix.os)) != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./_reports/coverage-${{ matrix.os }}.xml
          flags: ${{ runner.os }}

  windows-powershell:
    name: Run tests (Windows PowerShell 5)
    needs: analyse
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run the tests
        run: |
          md ./_reports
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          ./tests/test.ps1 -EnableExit `
            -TestResultOutputPath ./_reports/testresults-windows-latest-windows-powershell.xml
        shell: powershell

      - name: Upload Windows PowerShell test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test Report (windows-latest, Windows PowerShell)
          path: _reports/testresults-windows-latest-windows-powershell.xml

  package:
    name: Build and validate package
    needs: [analyse, test, windows-powershell]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the package
        id: build
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
        run: |
          Install-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0 `
            -Scope CurrentUser -Force
          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.2.0
          $version = (Test-ModuleManifest ./cd-extras/cd-extras.psd1).Version.ToString()
          if ($env:GIT_REF_TYPE -eq 'tag') {
            if ($env:GIT_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$env:GIT_REF_NAME' is not a valid release tag."
            }
            $version = $Matches.version
          }
          $package = ./publishme.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$package" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install and smoke-test the package
        env:
          PACKAGE_PATH: ${{ steps.build.outputs.path }}
          PACKAGE_VERSION: ${{ steps.build.outputs.version }}
        run: ./tests/validate-package.ps1 -PackagePath $env:PACKAGE_PATH -Version $env:PACKAGE_VERSION
        shell: pwsh

      - name: Upload the validated package
        uses: actions/upload-artifact@v6
        with:
          name: cd-extras-package-${{ github.sha }}-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
