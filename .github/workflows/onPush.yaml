name: Run tests
on: push

jobs:
  build:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run the tests
        run: |
          md ./_reports
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          ./tests/test.ps1 -Cover -EnableExit `
            -CoverageOutputPath ./_reports/coverage.xml `
            -TestResultOutputPath ./_reports/testresults-pwsh.xml
        shell: pwsh

      # run the tests again on Windows, this time in PowerShell v5
      - name: Run the tests (Powershell v5)
        if: matrix.os == 'windows-latest'
        run: |
          md ./_reports -ea Ignore
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          ./tests/test.ps1 -EnableExit `
            -TestResultOutputPath ./_reports/testresults-windows-powershell.xml
        shell: powershell

      - name: Upload test report
        uses: actions/upload-artifact@v6
        with:
          name: Test Report (${{ matrix.os }})
          path: _reports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./_reports/coverage.xml
          flags: ${{ runner.os }}
